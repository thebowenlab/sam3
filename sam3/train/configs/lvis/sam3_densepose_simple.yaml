# @package _global_
defaults:
  - _self_

# ============================================================================
# Paths Configuration (Chage this to your own paths)
# ============================================================================
paths:
  experiment_log_dir: "./log_dir/"
  bpe_path: "./sam3/assets/bpe_simple_vocab_16e6.txt.gz" # This should be under sam3/assets/bpe_simple_vocab_16e6.txt.gz

# LVIS dataset configuration
lvis_train:
  num_images: null # Note: This is the number of images used for training. If null, all images are used.

  # Training transforms pipeline
  train_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterCrowds
        - _target_: sam3.train.transforms.point_sampling.RandomizeInputBbox
          box_noise_std: 0.1
          box_noise_max: 20
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes:
            _target_: sam3.train.transforms.basic.get_random_resize_scales
            size: ${scratch.resolution}
            min_size: 480
            rounded: false
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
          size: ${scratch.resolution}
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
    - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
      query_filter:
        _target_: sam3.train.transforms.filter_query_transforms.FilterFindQueriesWithTooManyOut
        max_num_objects: ${scratch.max_ann_per_img}

  # Validation transforms pipeline
  val_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: False
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}

  # loss config (no mask loss)
  # loss:
  #   _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
  #   matcher: ${scratch.matcher}
  #   o2m_weight: 2.0
  #   o2m_matcher:
  #     _target_: sam3.train.matcher.BinaryOneToManyMatcher
  #     alpha: 0.3
  #     threshold: 0.4
  #     topk: 4
  #   use_o2m_matcher_on_o2m_aux: false # Another option is true
  #   loss_fns_find:
  #     - _target_: sam3.train.loss.loss_fns.Boxes
  #       weight_dict:
  #         loss_bbox: 5.0
  #         loss_giou: 2.0
  #     - _target_: sam3.train.loss.loss_fns.IABCEMdetr
  #       weak_loss: False
  #       weight_dict:
  #         loss_ce: 20.0 # Another option is 100.0
  #         presence_loss: 20.0
  #       pos_weight: 10.0 # Another option is 5.0
  #       alpha: 0.25
  #       gamma: 2
  #       use_presence: True  # Change
  #       pos_focal: false
  #       pad_n_queries: 200
  #       pad_scale_pos: 1.0

  #   loss_fn_semantic_seg: null
  #   scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}


  # NOTE: Loss to be used for training in case of segmentation
  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
    matcher: ${scratch.matcher}
    o2m_weight: 1
    o2m_matcher: ${scratch.o2m_matcher}
    use_o2m_matcher_on_o2m_aux: false
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: False
        weight_dict:
          loss_ce: 20 # Another option is 100.0
          presence_loss: 20
        pos_weight: 10.0 # Another option is 5.0
        alpha: 0.25
        gamma: 2
        presence_gamma: 2
        use_presence: True  # Change
        pos_focal: false
        pad_n_queries: 200
        pad_scale_pos: 1.0
      - _target_: sam3.train.loss.loss_fns.Masks
        focal_alpha: 0.25
        focal_gamma: 2.0
        weight_dict:
          loss_mask: 200.0
          loss_dice: 10.0
        compute_aux: false
      - _target_: sam3.train.loss.cse_soft_embed_loss.CSESoftEmbeddingLoss
        weight_dict:
          loss_cse_embed: 0.6     # tune this weight
        compute_aux: false
        embdist_gauss_sigma: 0.01 # temperature for embedding distances
        geodist_gauss_sigma: 0.01 # temperature for geodesic soft targets
      - _target_: sam3.train.loss.coarse_segm_loss.SegmentationLoss
        weight_dict:
          loss_coarse_segm: 5.0
        compute_aux: false
      - _target_: sam3.train.loss.pix2shape_loss.Pix2ShapeLoss
        weight_dict:
          loss_pix2shape_cycle: 0.0001     # tune this weight
        compute_aux: false
        embed_dim: ${trainer.model.cse_embedder.embed_dim}
        norm_p: 2
        num_pixels: 100
        pix_sigma: 5.0
        temp_pix_to_vertex: .05
        temp_vertex_to_pix: .05
    loss_fn_semantic_seg:
      _target_: sam3.train.loss.loss_fns.SemanticSegCriterion
      presence_head: True
      presence_loss: False  # Change
      focal: True
      focal_alpha: 0.6
      focal_gamma: 2.0
      downsample: False
      weight_dict:
        loss_semantic_seg: 20.0
        loss_semantic_presence: 1.0
        loss_semantic_dice: 30.0
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

# ============================================================================
# Different helper parameters and functions
# ============================================================================
scratch:
  enable_segmentation: True # NOTE: This is the number of queries used for segmentation
  # Model parameters
  d_model: 256
  pos_embed:
    _target_: sam3.model.position_encoding.PositionEmbeddingSine
    num_pos_feats: ${scratch.d_model}
    normalize: true
    scale: null
    temperature: 10000

  # Box processing
  use_presence_eval: True
  original_box_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1  # infinite detections
    use_original_ids: true
    use_original_sizes_box: true
    use_presence: ${scratch.use_presence_eval}

  mask_postprocessor_thresholded:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1 #infinite detections
    iou_type: "segm"
    use_original_ids: True
    use_original_sizes_box: false
    use_original_sizes_mask: true
    convert_mask_to_rle: True
    detection_threshold: 0.3
    use_presence: ${scratch.use_presence_eval}

  # Matcher configuration
  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2
    focal: true  # with `focal: true` it is equivalent to BinaryFocalHungarianMatcher
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2
    stable: False
  o2m_matcher:
    _target_: sam3.train.matcher.BinaryOneToManyMatcher
    alpha: 0.3
    threshold: 0.4
    topk: 4
  scale_by_find_batch_size: False

  # Image processing parameters
  resolution: 1008
  consistent_transform: False
  max_ann_per_img: 200

  # Normalization parameters
  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]
  val_norm_mean: [0.5, 0.5, 0.5]
  val_norm_std: [0.5, 0.5, 0.5]

  # Training parameters
  num_train_workers: 4
  num_val_workers: 0
  max_data_epochs: 20
  target_epoch_size: 1500
  hybrid_repeats: 1
  context_length: 2
  gather_pred_via_filesys: false

  # Learning rate and scheduler parameters
  lr_scale: .1
  lr_transformer: ${times:8e-2,${scratch.lr_scale}}
  lr_vision_backbone: ${times:2.5e-4,${scratch.lr_scale}}
  lr_language_backbone: ${times:5e-5,${scratch.lr_scale}}
  lr_densepose_head: .01
  lr_cse_embedder: .01

  lrd_vision_backbone: 0.9
  wd: 0.0001
  scheduler_timescale: 20
  scheduler_warmup: 20
  scheduler_cooldown: 20

  val_batch_size: 1
  collate_fn_val:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: lvis
    with_seg_masks: ${scratch.enable_segmentation} # Note: Set this to true if using segmentation masks!

  gradient_accumulation_steps: 2
  train_batch_size: 16
  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api_with_chunking
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    num_chunks: 2
    dict_key: all
    with_seg_masks: ${scratch.enable_segmentation} # Note: Set this to true if using segmentation masks!

# ============================================================================
# Trainer Configuration
# ============================================================================

trainer:

  _target_: sam3.train.trainer.Trainer
  skip_saving_ckpts: False
  empty_gpu_mem_cache_after_eval: True
  skip_first_val: False
  max_epochs: 40
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: 1
  mode: train
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  distributed:
    backend: nccl
    find_unused_parameters: True
    gradient_as_bucket_view: True

  loss:
    all: ${lvis_train.loss}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        limit_ids: ${lvis_train.num_images}
        transforms: ${lvis_train.train_transforms}
        load_segmentation: ${scratch.enable_segmentation}
        max_ann_per_img: 500000
        multiplier: 1
        max_train_queries: 50000
        max_val_queries: 50000
        training: true
        use_caching: False
        # img_folder: /home/camposadmin/Documents/lvis/combined2017
        img_folder: /home/camposadmin/Documents/lvis/train2014
        # ann_file: /home/camposadmin/Documents/lvis/cse_densepose_lvis_v1_ds2_train_v1_filtered_giraffe_has_cse.json
        ann_file: /home/camposadmin/Documents/lvis/densepose_train2014_cse_8k_subset.json

      shuffle: True
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      collate_fn: ${scratch.collate_fn}

    val:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        load_segmentation: ${scratch.enable_segmentation}
        coco_json_loader:
          _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
          include_negatives: true
          category_chunk_size: 16 # Note: You can increase this based on the memory of your GPU.
          _partial_: true
        # img_folder: /home/camposadmin/Documents/lvis/combined2017
        img_folder: /home/camposadmin/Documents/lvis/val2014
        # ann_file: /home/camposadmin/Documents/lvis/cse_densepose_lvis_v1_ds2_val_v1_filtered_giraffe_has_cse.json
        ann_file: /home/camposadmin/Documents/lvis/densepose_minival2014_cse.json

        transforms: ${lvis_train.val_transforms}
        max_ann_per_img: 100000
        multiplier: 1
        training: false

      shuffle: False
      batch_size: ${scratch.val_batch_size}
      num_workers: ${scratch.num_val_workers}
      pin_memory: True
      drop_last: False
      collate_fn: ${scratch.collate_fn_val}


  model:
    _target_: sam3.model_builder.build_sam3_densepose_image_model
    bpe_path: ${paths.bpe_path}
    device: cpus
    eval_mode: false
    model_init_path: '/home/camposadmin/Documents/experiments/deeplab head no modulation human only/deeplab head dphead + cseembed unfrozen after encoder tuned/checkpoints/checkpoint.pt'
    dp_init_path: /home/camposadmin/Documents/lvis/model_final_humans_deeplab.pkl
    use_deeplab_head: true
    enable_segmentation: ${scratch.enable_segmentation} # Warning: Enable this if using segmentation.
    unfrozen_prefixes: # Any model params with these prefixes will be unfrozen, and everything else frozen
      - "densepose_head" # used for predicting densepose embeddings
      - "cse_embedder" # used for embedding mesh vertices
      - "segmentation_head" # used for segmentation masks
      - "dot_prod_scoring" # used for bbox
      - "transformer.decoder.bbox_embed" # used for bbox
    cse_embedder:
      _target_: sam3.model.embedders.Embedder
      embed_dim: 16
      mesh_specs:
        "cat_7466":
          TYPE: vertex_feature
          NUM_VERTICES: 7466
          FEATURE_DIM: 256
          FEATURES_TRAINABLE: False
          IS_TRAINABLE: True
          INIT_FILE: "/home/camposadmin/Documents/lvis/mesh_vert_feats/phi_cat_7466_256.pkl"
        "dog_7466":
          TYPE: vertex_feature
          NUM_VERTICES: 7466
          FEATURE_DIM: 256
          FEATURES_TRAINABLE: False
          IS_TRAINABLE: True
          INIT_FILE: "/home/camposadmin/Documents/lvis/mesh_vert_feats/phi_dog_7466_256.pkl"
        "sheep_5004":
          TYPE: vertex_feature
          NUM_VERTICES: 5004
          FEATURE_DIM: 256
          FEATURES_TRAINABLE: False
          IS_TRAINABLE: True
          INIT_FILE: "/home/camposadmin/Documents/lvis/mesh_vert_feats/phi_sheep_5004_256.pkl"
        "horse_5004":
          TYPE: vertex_feature
          NUM_VERTICES: 5004
          FEATURE_DIM: 256
          FEATURES_TRAINABLE: False
          IS_TRAINABLE: True
          INIT_FILE: "/home/camposadmin/Documents/lvis/mesh_vert_feats/phi_horse_5004_256.pkl"
        "zebra_5002":
          TYPE: vertex_feature
          NUM_VERTICES: 5002
          FEATURE_DIM: 256
          FEATURES_TRAINABLE: False
          IS_TRAINABLE: True
          INIT_FILE: "/home/camposadmin/Documents/lvis/mesh_vert_feats/phi_zebra_5002_256.pkl"
        "giraffe_5002":
          TYPE: vertex_feature
          NUM_VERTICES: 5002
          FEATURE_DIM: 256
          FEATURES_TRAINABLE: False
          IS_TRAINABLE: True
          INIT_FILE: "/home/camposadmin/Documents/lvis/mesh_vert_feats/phi_giraffe_5002_256.pkl"
        "elephant_5002":
          TYPE: vertex_feature
          NUM_VERTICES: 5002
          FEATURE_DIM: 256
          FEATURES_TRAINABLE: False
          IS_TRAINABLE: True
          INIT_FILE: "/home/camposadmin/Documents/lvis/mesh_vert_feats/phi_elephant_5002_256.pkl"
        "cow_5002":
          TYPE: vertex_feature
          NUM_VERTICES: 5002
          FEATURE_DIM: 256
          FEATURES_TRAINABLE: False
          IS_TRAINABLE: True
          INIT_FILE: "/home/camposadmin/Documents/lvis/mesh_vert_feats/phi_cow_5002_256.pkl"
        "bear_4936":
          TYPE: vertex_feature
          NUM_VERTICES: 4936
          FEATURE_DIM: 256
          FEATURES_TRAINABLE: False
          IS_TRAINABLE: True
          INIT_FILE: "/home/camposadmin/Documents/lvis/mesh_vert_feats/phi_bear_4936_256.pkl"
        "smpl_27554":
          TYPE: vertex_feature
          NUM_VERTICES: 27554
          FEATURE_DIM: 256
          FEATURES_TRAINABLE: False
          IS_TRAINABLE: True
          INIT_FILE: "/home/camposadmin/Documents/lvis/mesh_vert_feats/phi_smpl_27554_256.pkl"
    matcher: ${scratch.matcher}
    o2m_matcher: ${scratch.o2m_matcher}

  meters:
    val:
      lvis:
        detection:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "segm"
          dump_dir: ${launcher.experiment_log_dir}/dumps/lvis/}
          merge_predictions: True
          postprocessor: ${scratch.mask_postprocessor_thresholded}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              # gt_path: /home/camposadmin/Documents/lvis/cse_densepose_lvis_v1_ds2_val_v1_filtered_giraffe_has_cse.json
              gt_path: ${trainer.data.val.dataset.ann_file}
              tide: False
              iou_type: "segm"
        # Mesh alignment (cross-mesh embedding quality)
        # mesh_alignment:
        #   _target_: sam3.eval.cse_meters.CSEMeshAlignmentMeter
        #   embedder: ${trainer.model.cse_embedder}
        #   mesh_keyvertices_path: /data/densepose/cse/mesh_keyvertices_v0.json
        #   mesh_names: null  # null = use all meshes in the embedder

        # Per-point GPS (AP computation)
        per_point_gps:
          _target_: sam3.eval.cse_meters.CSEPerPointGPSMeter
          detection_threshold: 0.3
          maxdets: 100
          use_presence: ${scratch.use_presence_eval}
          default_sigma: 0.255
          cat_to_mesh:
            943: "sheep_5004 "  # sheep
            1202: "zebra_5002" # zebra
            569: "horse_5004"  # horse
            496: "giraffe_5002"  # giraffe
            422: "elephant_5002"  # elephant
            80: "cow_5002"   # cow
            76: "bear_4936"  # bear
            225: "cat_7466"  # cat
            378: "dog_7466"  # dog
            1: "smpl_27554" # human
          out_dir: ${launcher.experiment_log_dir}

  optim:
    amp:
      enabled: True
      amp_dtype: float16

    optimizer:
      _target_: torch.optim.SGD
      momentum: .9
      weight_decay: 0.0001

    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    param_group_modifiers:
      - _target_: sam3.train.optim.optimizer.layer_decay_param_modifier
        _partial_: True
        layer_decay_value: ${scratch.lrd_vision_backbone}
        apply_to: 'backbone.vision_backbone.trunk'
        overrides:
          - pattern: '*pos_embed*'
            value: 1.0

    options:
      lr:
        - scheduler:  # transformer and class_embed
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_transformer}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_vision_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.vision_backbone.*'
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_language_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.language_backbone.*'
        - scheduler:
            _target_: sam3.train.optim.schedulers.WarmupMultiStepParamScheduler
            base_lr: ${scratch.lr_densepose_head}
            warmup_steps: ${scratch.scheduler_warmup}
            warmup_factor: .1
            steps:
              - 40000
              - 60000
              - 80000
            step_ratio: .1
          param_names:
            - 'densepose_head.*'
        - scheduler:
            _target_: sam3.train.optim.schedulers.WarmupMultiStepParamScheduler
            base_lr: ${scratch.lr_cse_embedder}
            warmup_steps: ${scratch.scheduler_warmup}
            warmup_factor: .1
            steps:
              - 40000
              - 60000
              - 80000
            step_ratio: .1
          param_names:
            - 'cse_embedder.*'
        # - scheduler:
        #     _target_: sam3.train.optim.schedulers.WarmupMultiStepParamScheduler
        #     base_lr: ${scratch.lr_segmentation_head}
        #     warmup_steps: ${scratch.scheduler_warmup}
        #     warmup_factor: .1
        #     steps:
        #       - 3000
        #       - 6000
        #       - 18000
        #     step_ratio: .1
        #   param_names:
        #     - 'segmentation_head.*'

      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
          param_names:
            - 'densepose_head.*conv*weight*'
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
          param_names:
            - 'cse_embedder.*'
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - 'transformer.*bias*'
            - 'segmentation_head.*bias*'
            - 'geometry_encoder.*bias*'
            - 'dot_prod_scoring.*bias*'
            - 'backbone.*bias*'
            - 'densepose_head.*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 0  # 0 only last checkpoint is saved.

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: True
    wandb_writer: null
    log_dir: ${launcher.experiment_log_dir}/logs/lvis
    log_freq: 10

# ============================================================================
# Launcher and Submitit Configuration
# ============================================================================

launcher:
  num_nodes: 1
  gpus_per_node: 1
  experiment_log_dir: ${paths.experiment_log_dir}
  multiprocessing_context: forkserver

submitit:
  account: null
  partition: null
  qos: null
  timeout_hour: 72
  use_cluster: True
  cpus_per_task: 10
  port_range: [10000, 65000]
  constraint: null
  # Uncomment for job array configuration
  job_array:
    num_tasks: 100
    task_index: 0


